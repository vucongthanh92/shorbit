serviceName: shortbit
development: true
database:
  readDb:
    connectionString: postgresql://dev:dev@127.0.0.1:5432/dev_db?sslmode=disable
    dbType: postgres
    migrationFilePath: migrations
    maxIdleConns: 100
    maxOpenConns: 200
    connMaxLifetime: 5
  writeDb:
    connectionString: postgresql://dev:dev@127.0.0.1:5432/dev_db?sslmode=disable
    dbType: postgres
    migrationFilePath: migrations
    maxIdleConns: 100
    maxOpenConns: 200
    connMaxLifetime: 5
http:
  port: :3300
  development: true
  shutdownTimeout: 15
  resources: []
  allowOrigins: ["http://localhost:8080"]
logger:
  level: debug
  devMode: false
  encoder: json
tracing:
  enable: false
  serviceName: shortbit
  hostPort: "localhost:4317"
  logSpans: false
redis:
  addrs: ["localhost:6379"]
  password: ""
  db: 0
  poolSize: 100
heathcheck:
  interval: 10
  port: :7000
  goroutineThreshold: 1000
metrics:
  prometheusPath: /metrics
  prometheusPort: :8000
cacheTTLSeconds: 300
